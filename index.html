<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life PMC — Quest Log</title>
<style>
  :root {
    --bg: #0d0f0e;
    --surface: #161a18;
    --surface2: #1e2421;
    --border: #2a302d;
    --border2: #3a4240;
    --text: #c8d4c8;
    --text-muted: #6a7d70;
    --text-dim: #485248;
    --accent: #4a9e6a;
    --accent-dim: #1d3a28;
    --accent-bright: #5ec47f;
    --warn: #c49a2a;
    --warn-dim: #3a2e0d;
    --danger: #c45a4a;
    --danger-dim: #3a1a14;
    --xp-color: #7ab8f5;
    --radius: 6px;
    --font: 'Share Tech Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding: 0;
  }

  /* ── SCANLINE OVERLAY ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.08) 3px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  .app {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 2rem 4rem;
  }

  @media (min-width: 1400px) {
    .app { max-width: 1140px; }
  }

  /* ── HEADER ── */
  .header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .logo {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    margin-bottom: 4px;
  }

  .title {
    font-size: 22px;
    color: var(--accent-bright);
    letter-spacing: 0.08em;
  }

  .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
    letter-spacing: 0.05em;
  }

  /* ── LEVEL BLOCK ── */
  .level-block {
    text-align: right;
    min-width: 180px;
  }

  .level-name {
    font-size: 13px;
    color: var(--xp-color);
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }

  .xp-row {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: flex-end;
    margin-bottom: 5px;
  }

  .xp-num {
    font-size: 11px;
    color: var(--text-muted);
  }

  .pip-btn {
    margin-top: 8px;
    padding: 5px 10px;
    font-size: 10px;
    font-family: var(--font);
    letter-spacing: 0.03em;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text-muted);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
  }

  .pip-btn:hover { border-color: var(--accent); color: var(--accent-bright); }

  .xp-bar-bg {
    width: 140px;
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .xp-bar-fill {
    height: 100%;
    background: var(--xp-color);
    border-radius: 3px;
    transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 6px rgba(122,184,245,0.5);
  }

  /* ── STATS ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 1.75rem;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem;
    text-align: center;
  }

  .stat-n {
    font-size: 24px;
    color: var(--text);
    letter-spacing: 0.05em;
  }

  .stat-l {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    margin-top: 3px;
    text-transform: uppercase;
  }

  /* ── TOOLS ── */
  .tools-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 1.75rem;
  }

  .tool-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }

  .tool-title {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* Pomodoro */
  .pomo-modes {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }

  .pomo-mode-btn {
    flex: 1;
    padding: 6px 0;
    font-size: 10px;
    font-family: var(--font);
    letter-spacing: 0.03em;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
  }

  .pomo-mode-btn.active {
    color: var(--accent-bright);
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .pomo-display {
    text-align: center;
    font-size: 42px;
    color: var(--xp-color);
    letter-spacing: 0.05em;
    margin: 6px 0 14px;
  }

  .pomo-controls {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .pomo-btn {
    padding: 8px 18px;
    font-size: 12px;
    font-family: var(--font);
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text);
    border-radius: var(--radius);
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }

  .pomo-btn:hover { border-color: var(--accent); color: var(--accent-bright); }

  .pomo-btn.primary {
    background: var(--accent);
    color: #0a1a10;
    border-color: var(--accent);
    font-weight: bold;
  }

  .pomo-count {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 12px;
  }

  /* YouTube */
  .yt-frame-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .yt-frame-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .yt-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 0 1rem;
  }

  .yt-input-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }

  .yt-input-row input {
    flex: 1;
    height: 32px;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    padding: 0 8px;
    outline: none;
    min-width: 0;
    transition: border-color 0.15s;
  }

  .yt-input-row input:focus { border-color: var(--accent); }

  .yt-add-btn {
    height: 32px;
    padding: 0 14px;
    background: var(--xp-color);
    color: #0a1a2a;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s;
  }

  .yt-add-btn:hover { opacity: 0.85; }

  .yt-fav-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 110px;
    overflow-y: auto;
  }

  .yt-fav-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: var(--surface2);
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .yt-fav-item:hover { background: var(--border); }

  .yt-fav-item span {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .yt-fav-del {
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 11px;
    flex-shrink: 0;
  }

  .yt-fav-del:hover { color: var(--danger); }

  .yt-fav-empty {
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding: 6px 0;
  }

  /* ── FILTER TABS ── */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .tab {
    padding: 5px 12px;
    font-size: 11px;
    font-family: var(--font);
    letter-spacing: 0.1em;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s;
  }

  .tab:hover { color: var(--text); border-color: var(--border2); }
  .tab.active { color: var(--accent-bright); border-color: var(--accent); background: var(--accent-dim); }

  /* ── SECTION LABEL ── */
  .section-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 6px;
    margin-top: 1.25rem;
  }

  /* ── QUEST CARDS ── */
  .quest-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .quest {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.875rem 1rem;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }

  .quest::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--border2);
    transition: background 0.15s;
  }

  .quest[data-cat="研究"]::before { background: var(--accent); }
  .quest[data-cat="映像"]::before { background: var(--warn); }
  .quest[data-cat="生活"]::before { background: var(--xp-color); }
  .quest[data-cat="その他"]::before { background: #b07af5; }

  .quest:hover:not(.done) {
    border-color: var(--border2);
    background: var(--surface2);
  }

  .quest.done {
    opacity: 0.55;
    cursor: pointer;
    border-color: var(--border);
  }

  .quest.done::before { background: var(--accent) !important; }

  .check {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 13px;
    color: var(--text-dim);
    transition: all 0.2s;
  }

  .quest.done .check {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .quest-body { flex: 1; min-width: 0; }

  .quest-name {
    font-size: 14px;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .quest.done .quest-name {
    text-decoration: line-through;
    color: var(--text-dim);
  }

  .quest-meta {
    display: flex;
    gap: 10px;
    margin-top: 4px;
    align-items: center;
  }

  .cat-badge {
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 2px 7px;
    border-radius: 3px;
    text-transform: uppercase;
  }

  .cat-研究  { color: var(--accent-bright); background: var(--accent-dim); }
  .cat-映像  { color: var(--warn); background: var(--warn-dim); }
  .cat-生活  { color: var(--xp-color); background: #1a2a3a; }
  .cat-その他 { color: #b07af5; background: #241a38; }

  .deadline {
    font-size: 10px;
    color: var(--text-muted);
  }

  .deadline.urgent { color: var(--danger); }

  .quest-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }

  .xp-reward {
    font-size: 12px;
    color: var(--xp-color);
    letter-spacing: 0.05em;
  }

  .quest.done .xp-reward { color: var(--accent); }

  .del-btn {
    font-size: 10px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    padding: 2px 4px;
    border-radius: 3px;
    transition: color 0.15s;
  }

  .del-btn:hover { color: var(--danger); }

  /* ── ADD FORM ── */
  .add-form {
    margin-top: 1.75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
  }

  .add-form-label {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .add-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .add-row input,
  .add-row select {
    height: 36px;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 0 10px;
    outline: none;
    transition: border-color 0.15s;
  }

  .add-row input { flex: 1; min-width: 200px; }
  .add-row input:focus { border-color: var(--accent); }

  .add-row select option { background: var(--surface2); }

  .add-row input[type="date"] { min-width: 150px; }

  .add-btn {
    height: 36px;
    padding: 0 16px;
    background: var(--accent);
    color: #0a1a10;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  .add-btn:hover { opacity: 0.85; }

  .err {
    font-size: 11px;
    color: var(--danger);
    margin-top: 6px;
    display: none;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--accent-bright);
    font-family: var(--font);
    font-size: 13px;
    letter-spacing: 0.05em;
    padding: 10px 20px;
    border-radius: var(--radius);
    pointer-events: none;
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    opacity: 0;
    z-index: 999;
    white-space: nowrap;
    box-shadow: 0 0 20px rgba(74,158,106,0.25);
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ── LEVELUP OVERLAY ── */
  .levelup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .levelup.show { opacity: 1; pointer-events: all; }

  .levelup-box {
    text-align: center;
    border: 1px solid var(--xp-color);
    background: var(--surface);
    padding: 2.5rem 3rem;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(122,184,245,0.3);
  }

  .levelup-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    margin-bottom: 8px;
  }

  .levelup-name {
    font-size: 28px;
    color: var(--xp-color);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .levelup-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .levelup-close {
    margin-top: 1.5rem;
    padding: 8px 20px;
    background: var(--xp-color);
    color: #0a1a2a;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  .empty {
    text-align: center;
    padding: 2rem;
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.05em;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  /* ── SYNC ── */
  .sync-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.6rem 0.9rem;
    margin-bottom: 1.5rem;
  }

  .sync-status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .sync-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }

  .sync-dot.on {
    background: var(--accent-bright);
    box-shadow: 0 0 5px rgba(94,196,127,0.6);
  }

  .sync-connect {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }

  .sync-connect input {
    height: 30px;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    padding: 0 8px;
    outline: none;
    min-width: 160px;
    flex: 1;
  }

  .sync-connect input:focus { border-color: var(--accent); }

  .sync-btn {
    height: 30px;
    padding: 0 12px;
    background: var(--accent);
    color: #0a1a10;
    border: none;
    border-radius: var(--radius);
    font-family: var(--font);
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    letter-spacing: 0.03em;
    transition: opacity 0.15s;
  }

  .sync-btn:hover { opacity: 0.85; }

  .sync-btn.ghost {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text-muted);
    font-weight: normal;
  }

  .sync-help {
    font-size: 11px;
    color: var(--xp-color);
    text-decoration: none;
    white-space: nowrap;
  }

  .sync-help:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .app { padding: 1.25rem 1rem 3rem; }
    .stats { grid-template-columns: repeat(3,1fr); }
    .header-top { flex-direction: column; }
    .level-block { text-align: left; width: 100%; }
    .xp-bar-bg { width: 100%; flex: 1; }
    .quest { flex-wrap: wrap; }
    .quest-right { flex-direction: row; align-items: center; gap: 10px; margin-left: 38px; }
    .title { font-size: 19px; }
    .tools-grid { grid-template-columns: 1fr; }
    .pomo-display { font-size: 36px; }
  }
</style>

<body>

<div class="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="logo">// PERSONAL QUEST LOG</div>
        <div class="title">Life PMC</div>
        <div class="subtitle">研究・映像制作・私生活のタスク管理</div>
      </div>
      <div class="level-block">
        <div class="level-name" id="level-name">RECRUIT</div>
        <div class="xp-row">
          <div class="xp-bar-bg">
            <div class="xp-bar-fill" id="xp-bar" style="width:0%"></div>
          </div>
          <span class="xp-num" id="xp-num">0 XP</span>
        </div>
        <button class="pip-btn" id="pip-btn" onclick="togglePinp()">🪟 フロート表示</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="stat-n" id="s-total">0</div><div class="stat-l">Quests</div></div>
      <div class="stat"><div class="stat-n" id="s-done">0</div><div class="stat-l">Completed</div></div>
      <div class="stat"><div class="stat-n" id="s-remain">0</div><div class="stat-l">Remaining</div></div>
      <div class="stat"><div class="stat-n" id="s-xp">0</div><div class="stat-l">Total XP</div></div>
      <div class="stat"><div class="stat-n" id="s-streak">0</div><div class="stat-l">Day streak</div></div>
    </div>
  </div>

  <div class="section-label">// TOOLS</div>
  <div class="tools-grid">
    <div class="tool-card">
      <div class="tool-title">Pomodoro timer</div>
      <div class="pomo-modes">
        <button class="pomo-mode-btn active" id="pomo-mode-focus" onclick="pomoSetMode('focus')">FOCUS 25</button>
        <button class="pomo-mode-btn" id="pomo-mode-short" onclick="pomoSetMode('short')">BREAK 5</button>

    </div>
    <button class="sync-btn ghost" id="sync-disconnect-btn" onclick="syncDisconnect()" style="display:none;">切断</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-filter="all" onclick="setFilter('all',this)">ALL</button>
    <button class="tab" data-filter="active" onclick="setFilter('active',this)">ACTIVE</button>
    <button class="tab" data-filter="done" onclick="setFilter('done',this)">DONE</button>
    <button class="tab" data-filter="研究" onclick="setFilter('研究',this)">研究</button>
    <button class="tab" data-filter="映像" onclick="setFilter('映像',this)">映像</button>
    <button class="tab" data-filter="生活" onclick="setFilter('生活',this)">生活</button>
    <button class="tab" data-filter="その他" onclick="setFilter('その他',this)">その他</button>
  </div>

  <div class="section-label">// QUEST LOG</div>
  <div class="quest-list" id="quest-list"></div>

  <div class="add-form">
    <div class="add-form-label">// ADD QUEST</div>
    <div class="add-row">
      <input type="text" id="new-name" placeholder="タスク名を入力..." />
      <select id="new-cat">
        <option value="研究">研究</option>
        <option value="映像">映像</option>
        <option value="生活">生活</option>
        <option value="その他">その他</option>
      </select>
      <input type="date" id="new-deadline" />
      <button class="add-btn" onclick="addTask()">+ ADD QUEST</button>
    </div>
    <div class="err" id="err">タスク名を入力してください</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="levelup" id="levelup">
  <div class="levelup-box">
    <div class="levelup-label">// RANK UP</div>
    <div class="levelup-name" id="lu-name">TRAINEE</div>
    <div class="levelup-sub" id="lu-sub">新しいランクに到達しました</div>
    <button class="levelup-close" onclick="closeLevelup()">CONFIRM</button>
  </div>
</div>

<script>
const XP_BY_CAT = { '研究': 40, '映像': 35, '生活': 20, 'その他': 25 };

const LEVELS = [
  { min:0,    max:100,  name:'RECRUIT',    sub:'クエスト消化の第一歩' },
  { min:100,  max:250,  name:'TRAINEE',    sub:'ペースが掴めてきた' },
  { min:250,  max:500,  name:'NOVICE',     sub:'安定して進められている' },
  { min:500,  max:900,  name:'OPERATOR',   sub:'複数プロジェクトを並走中' },
  { min:900,  max:1500, name:'EXPERT',     sub:'かなりの実績' },
  { min:1500, max:9999, name:'MASTER PMC', sub:'ベテランの域' }
];

const DEFAULT_TASKS = [
  { id:1, name:'UVデータの収集・整理', cat:'研究', done:false, deadline:'2025-11-30' },
  { id:2, name:'UVデータを棒グラフに可視化', cat:'研究', done:false, deadline:'2025-11-30' },
  { id:3, name:'細胞イメージング実験', cat:'研究', done:false, deadline:'2025-12-15' },
  { id:4, name:'イメージング結果の解析', cat:'研究', done:false, deadline:'2025-12-20' },
  { id:5, name:'副テーマ論文まとめ', cat:'研究', done:false, deadline:'2025-12-26' },
  { id:6, name:'メインテーマ現状把握・棚卸し', cat:'研究', done:false, deadline:'2025-10-31' },
  { id:7, name:'教授とゴール設定の面談', cat:'研究', done:false, deadline:'2025-10-31' },
  { id:8, name:'学位申請', cat:'研究', done:false, deadline:'2026-01-30' },
  { id:9, name:'論文提出', cat:'研究', done:false, deadline:'2026-02-03' },
  { id:10, name:'修士論文発表', cat:'研究', done:false, deadline:'2026-02-13' },
  { id:11, name:'映像案件の編集作業', cat:'映像', done:false, deadline:null },
  { id:12, name:'クライアントに納品', cat:'映像', done:false, deadline:null },
];

let state = load();
state.streakDates = state.streakDates || [];
state.ytFavorites = state.ytFavorites || [];
{
  const _today = dateStr(new Date());
  if (state.pomoDate !== _today) { state.pomoDate = _today; state.pomoToday = 0; }
}
let filter = 'all';
let nextId = Math.max(...state.tasks.map(t=>t.id), 10) + 1;
let nextYtId = Math.max(...state.ytFavorites.map(f=>f.id), 0) + 1;
let pipWindowRef = null;
let pipContainerRef = null;

function dateStr(d) {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function computeStreak() {
  const dates = new Set(state.streakDates || []);
  let cursor = new Date();
  if (!dates.has(dateStr(cursor))) cursor.setDate(cursor.getDate() - 1);
  let streak = 0;
  while (dates.has(dateStr(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function load() {
  try {
    const s = localStorage.getItem('life-pmc');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return { tasks: JSON.parse(JSON.stringify(DEFAULT_TASKS)), xp: 0, streakDates: [], ytFavorites: [], pomoToday: 0, pomoDate: null };
}

function save() {
  localStorage.setItem('life-pmc', JSON.stringify(state));
  cloudPush();
}

function getLevel(xp) {
  for (const lv of LEVELS) if (xp >= lv.min && xp < lv.max) return lv;
  return LEVELS[LEVELS.length-1];
}

function isUrgent(deadline) {
  if (!deadline) return false;
  const d = new Date(deadline);
  const now = new Date();
  const diff = (d - now) / (1000*60*60*24);
  return diff >= 0 && diff <= 14;
}

function isPast(deadline) {
  if (!deadline) return false;
  return new Date(deadline) < new Date();
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const lv = getLevel(state.xp);
  const pct = Math.min(100, Math.round((state.xp - lv.min) / (lv.max - lv.min) * 100));
  document.getElementById('xp-bar').style.width = pct + '%';
  document.getElementById('level-name').textContent = lv.name;
  document.getElementById('xp-num').textContent = state.xp + ' XP';

  const total = state.tasks.length;
  const done = state.tasks.filter(t=>t.done).length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-remain').textContent = total - done;
  document.getElementById('s-xp').textContent = state.xp;
  document.getElementById('s-streak').textContent = computeStreak();
  if (pipContainerRef) renderPipContent();

  let visible = state.tasks;
  if (filter === 'active') visible = visible.filter(t => !t.done);
  else if (filter === 'done') visible = visible.filter(t => t.done);
  else if (['研究','映像','生活','その他'].includes(filter)) visible = visible.filter(t => t.cat === filter);

  const active = visible.filter(t=>!t.done);
  const doneList = visible.filter(t=>t.done);
  const sorted = [...active, ...doneList];

  const list = document.getElementById('quest-list');
  list.innerHTML = '';

  if (sorted.length === 0) {
    list.innerHTML = '<div class="empty">// NO QUESTS FOUND</div>';
    return;
  }

  sorted.forEach(t => {
    const xp = XP_BY_CAT[t.cat] || 20;
    const urgent = !t.done && isUrgent(t.deadline);
    const past = !t.done && isPast(t.deadline);
    const div = document.createElement('div');
    div.className = 'quest' + (t.done ? ' done' : '');
    div.setAttribute('data-cat', t.cat);

    let deadlineHtml = '';
    if (t.deadline) {
      const cls = past ? 'deadline urgent' : (urgent ? 'deadline urgent' : 'deadline');
      const prefix = past ? '⚠ OVERDUE ' : (urgent ? '⚡ ' : '');
      deadlineHtml = `<span class="${cls}">${prefix}${fmtDate(t.deadline)}</span>`;
    }

    div.innerHTML = `
      <div class="check">${t.done ? '✓' : '○'}</div>
      <div class="quest-body">
        <div class="quest-name">${t.name}</div>
        <div class="quest-meta">
          <span class="cat-badge cat-${t.cat}">${t.cat}</span>
          ${deadlineHtml}
        </div>
      </div>
      <div class="quest-right">
        <span class="xp-reward">${t.done ? '✓' : '+'} ${xp} XP</span>
        ${!t.done
          ? `<button class="del-btn" onclick="deleteTask(${t.id},event)">DELETE</button>`
          : `<button class="del-btn" onclick="uncomplete(${t.id},event)">UNDO</button>`}
      </div>
    `;
    if (!t.done) div.onclick = () => complete(t.id);
    else div.onclick = () => uncomplete(t.id);
    list.appendChild(div);
  });
}

function complete(id) {
  const t = state.tasks.find(x=>x.id===id);
  if (!t || t.done) return;
  const prevLv = getLevel(state.xp).name;
  t.done = true;
  const xp = XP_BY_CAT[t.cat] || 20;
  state.xp += xp;
  const today = dateStr(new Date());
  if (!state.streakDates.includes(today)) state.streakDates.push(today);
  save();
  playBeep();
  showToast(`🎯 QUEST COMPLETE — +${xp} XP`);
  const newLv = getLevel(state.xp);
  if (newLv.name !== prevLv) {
    setTimeout(() => showLevelup(newLv), 800);
  }
  render();
}

function deleteTask(id, e) {
  e.stopPropagation();
  state.tasks = state.tasks.filter(t=>t.id!==id);
  save();
  render();
}

function uncomplete(id, e) {
  if (e) e.stopPropagation();
  const t = state.tasks.find(x=>x.id===id);
  if (!t || !t.done) return;
  t.done = false;
  const xp = XP_BY_CAT[t.cat] || 20;
  state.xp = Math.max(0, state.xp - xp);
  save();
  showToast('// QUEST REVERTED');
  render();
}

function addTask() {
  const name = document.getElementById('new-name').value.trim();
  const cat = document.getElementById('new-cat').value;
  const deadline = document.getElementById('new-deadline').value;
  const err = document.getElementById('err');
  if (!name) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  state.tasks.push({ id: nextId++, name, cat, done: false, deadline: deadline || null });
  document.getElementById('new-name').value = '';
  document.getElementById('new-deadline').value = '';
  save();
  render();
  showToast('// NEW QUEST ADDED');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

function showLevelup(lv) {
  document.getElementById('lu-name').textContent = lv.name;
  document.getElementById('lu-sub').textContent = lv.sub;
  document.getElementById('levelup').classList.add('show');
  playLevelup();
}

function closeLevelup() {
  document.getElementById('levelup').classList.remove('show');
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[880,0,0.1],[1100,0.12,0.1],[1320,0.24,0.15]].forEach(([f,s,d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = 'square';
      g.gain.setValueAtTime(0.07, ctx.currentTime+s);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+s+d);
      o.start(ctx.currentTime+s); o.stop(ctx.currentTime+s+d+0.05);
    });
  } catch(e) {}
}

function playLevelup() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [[523,0,0.15],[659,0.15,0.15],[784,0.3,0.15],[1047,0.45,0.35]].forEach(([f,s,d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = 'triangle';
      g.gain.setValueAtTime(0.1, ctx.currentTime+s);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+s+d);
      o.start(ctx.currentTime+s); o.stop(ctx.currentTime+s+d+0.05);
    });
  } catch(e) {}
}

/* ── POMODORO ── */
const POMO_DURATIONS = { focus: 25*60, short: 5*60, long: 15*60 };
let pomoMode = 'focus';
let pomoSeconds = POMO_DURATIONS.focus;
let pomoTimer = null;
let pomoRunning = false;

function pomoUpdateDisplay() {
  const m = Math.floor(pomoSeconds/60);
  const s = pomoSeconds%60;
  document.getElementById('pomo-display').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function pomoSetMode(mode) {
  if (pomoRunning) pomoPause();
  pomoMode = mode;
  pomoSeconds = POMO_DURATIONS[mode];
  document.querySelectorAll('.pomo-mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pomo-mode-' + mode).classList.add('active');
  pomoUpdateDisplay();
}

function pomoToggle() {
  if (pomoRunning) pomoPause();
  else pomoStart();
}

function pomoStart() {
  if (pomoRunning) return;
  pomoRunning = true;
  document.getElementById('pomo-toggle').textContent = 'PAUSE';
  pomoTimer = setInterval(() => {
    pomoSeconds--;
    pomoUpdateDisplay();
    if (pomoSeconds <= 0) pomoComplete();
  }, 1000);
}

function pomoPause() {
  pomoRunning = false;
  clearInterval(pomoTimer);
  document.getElementById('pomo-toggle').textContent = 'START';
}

function pomoReset() {
  pomoPause();
  pomoSeconds = POMO_DURATIONS[pomoMode];
  pomoUpdateDisplay();
}

function pomoComplete() {
  pomoPause();
  if (pomoMode === 'focus') {
    const prevLv = getLevel(state.xp).name;
    state.pomoToday = (state.pomoToday || 0) + 1;
    state.xp += 15;
    save();
    document.getElementById('pomo-count-today').textContent = state.pomoToday;
    playLevelup();
    showToast('🍅 FOCUS COMPLETE — +15 XP');
    const newLv = getLevel(state.xp);
    if (newLv.name !== prevLv) setTimeout(() => showLevelup(newLv), 900);
    render();
  } else {
    playBeep();
    showToast('☕ BREAK COMPLETE');
  }
  pomoSeconds = POMO_DURATIONS[pomoMode];
  pomoUpdateDisplay();
}

/* ── YOUTUBE ── */
function ytExtractId(url) {
  url = (url || '').trim();
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  return null;
}

function ytPlay(videoId) {
  const wrap = document.getElementById('yt-frame-wrap');
  wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
}

function ytAddFavorite() {
  const urlInput = document.getElementById('yt-url');
  const titleInput = document.getElementById('yt-title');
  const videoId = ytExtractId(urlInput.value);
  if (!videoId) { showToast('// INVALID YOUTUBE URL'); return; }
  const title = titleInput.value.trim() || videoId;
  state.ytFavorites.push({ id: nextYtId++, videoId, title });
  urlInput.value = '';
  titleInput.value = '';
  save();
  renderYtFavorites();
  ytPlay(videoId);
}

function ytDeleteFavorite(id, e) {
  e.stopPropagation();
  state.ytFavorites = state.ytFavorites.filter(f => f.id !== id);
  save();
  renderYtFavorites();
}

function renderYtFavorites() {
  const list = document.getElementById('yt-fav-list');
  list.innerHTML = '';
  if (state.ytFavorites.length === 0) {
    list.innerHTML = '<div class="yt-fav-empty">お気に入りはまだありません</div>';
    return;
  }
  state.ytFavorites.forEach(f => {
    const div = document.createElement('div');
    div.className = 'yt-fav-item';
    div.innerHTML = `<span>▶ ${f.title}</span><button class="yt-fav-del" onclick="ytDeleteFavorite(${f.id},event)">✕</button>`;
    div.onclick = () => ytPlay(f.videoId);
    list.appendChild(div);
  });
}

/* ── PICTURE-IN-PICTURE ── */
async function togglePinp() {
  if (pipWindowRef) {
    pipWindowRef.close();
    return;
  }
  if (!('documentPictureInPicture' in window)) {
    showToast('// フロート表示はChrome / Edgeのみ対応しています');
    return;
  }
  try {
    const pipWindow = await documentPictureInPicture.requestWindow({ width: 300, height: 420 });
    pipWindow.document.title = 'Life PMC';
    pipWindow.document.body.style.margin = '0';
    pipWindow.document.body.style.background = '#0d0f0e';

    const fontLink = pipWindow.document.createElement('link');
    fontLink.rel = 'stylesheet';
    fontLink.href = 'https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap';
    pipWindow.document.head.appendChild(fontLink);

    const container = pipWindow.document.createElement('div');
    container.id = 'pip-root';
    container.style.cssText = 'background:#0d0f0e; min-height:100vh; padding:14px; box-sizing:border-box; font-family:"Share Tech Mono",monospace;';
    pipWindow.document.body.appendChild(container);

    pipWindowRef = pipWindow;
    pipContainerRef = container;
    renderPipContent();

    const btn = document.getElementById('pip-btn');
    if (btn) btn.textContent = '🪟 フロートを閉じる';

    pipWindow.addEventListener('pagehide', () => {
      pipWindowRef = null;
      pipContainerRef = null;
      const b = document.getElementById('pip-btn');
      if (b) b.textContent = '🪟 フロート表示';
    });
  } catch (e) {
    showToast('// フロート表示の起動に失敗しました');
  }
}

function renderPipContent() {
  if (!pipContainerRef || !pipWindowRef) return;
  const doc = pipWindowRef.document;
  const lv = getLevel(state.xp);
  const pct = Math.min(100, Math.round((state.xp - lv.min) / (lv.max - lv.min) * 100));
  const active = [...state.tasks.filter(t => !t.done)].sort((a,b) => {
    return (a.deadline || '9999-99-99') < (b.deadline || '9999-99-99') ? -1 : 1;
  });

  pipContainerRef.innerHTML = `
    <div style="font-size:11px;color:#7ab8f5;letter-spacing:.08em;margin-bottom:2px;">LIFE PMC</div>
    <div style="font-size:10px;color:#6a7d70;margin-bottom:8px;">${lv.name} — ${state.xp} XP</div>
    <div style="height:4px;background:#2a302d;border-radius:2px;overflow:hidden;margin-bottom:12px;">
      <div style="height:100%;width:${pct}%;background:#7ab8f5;"></div>
    </div>
    <div id="pip-list" style="display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;"></div>
  `;

  const list = pipContainerRef.querySelector('#pip-list');
  if (active.length === 0) {
    list.innerHTML = '<div style="font-size:11px;color:#485248;">クエストはありません</div>';
    return;
  }

  active.slice(0, 12).forEach(t => {
    const xp = XP_BY_CAT[t.cat] || 20;
    const row = doc.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:7px 8px;background:#161a18;border:1px solid #2a302d;border-radius:6px;cursor:pointer;';
    row.innerHTML = `<span style="width:16px;height:16px;border-radius:50%;border:1.5px solid #3a4240;flex-shrink:0;"></span><span style="flex:1;font-size:11px;color:#c8d4c8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.name}</span><span style="font-size:10px;color:#7ab8f5;flex-shrink:0;">+${xp}</span>`;
    row.onclick = () => { complete(t.id); };
    list.appendChild(row);
  });
}

document.getElementById('yt-url').addEventListener('keydown', e => {
  if (e.key === 'Enter') ytAddFavorite();
});
document.getElementById('yt-title').addEventListener('keydown', e => {
  if (e.key === 'Enter') ytAddFavorite();
});

document.getElementById('new-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

renderYtFavorites();
document.getElementById('pomo-count-today').textContent = state.pomoToday || 0;
pomoUpdateDisplay();
render();

/* ── CLOUD SYNC (GitHub Gist) ── */
const GITHUB_API = 'https://api.github.com';
const GIST_FILENAME = 'life-pmc-data.json';
let cloudPushTimer = null;

function getToken() { return localStorage.getItem('life-pmc-gh-token'); }
function getGistId() { return localStorage.getItem('life-pmc-gist-id'); }

function renderSyncStatus(connected) {
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-status-text');
  const connectPanel = document.getElementById('sync-connect-panel');
  const disconnectBtn = document.getElementById('sync-disconnect-btn');
  if (connected) {
    dot.classList.add('on');
    text.textContent = '同期中 — GitHubに保存';
    connectPanel.style.display = 'none';
    disconnectBtn.style.display = 'inline-block';
  } else {
    dot.classList.remove('on');
    text.textContent = '未接続 — この端末のみ';
    connectPanel.style.display = 'flex';
    disconnectBtn.style.display = 'none';
  }
}

async function findOrCreateGist(token) {
  const listRes = await fetch(`${GITHUB_API}/gists`, {
    headers: { Authorization: `token ${token}` }
  });
  if (!listRes.ok) throw new Error('list failed');
  const gists = await listRes.json();
  const existing = gists.find(g => g.files && g.files[GIST_FILENAME]);
  if (existing) return existing.id;

  const createRes = await fetch(`${GITHUB_API}/gists`, {
    method: 'POST',
    headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      description: 'Life PMC sync data — do not edit manually',
      public: false,
      files: { [GIST_FILENAME]: { content: JSON.stringify(state) } }
    })
  });
  if (!createRes.ok) throw new Error('create failed');
  const created = await createRes.json();
  return created.id;
}

async function cloudPull(token, gistId) {
  const res = await fetch(`${GITHUB_API}/gists/${gistId}`, {
    headers: { Authorization: `token ${token}` }
  });
  if (!res.ok) throw new Error('pull failed');
  const data = await res.json();
  const file = data.files && data.files[GIST_FILENAME];
  if (file && file.content) {
    const cloud = JSON.parse(file.content);
    state = cloud;
    state.streakDates = state.streakDates || [];
    state.ytFavorites = state.ytFavorites || [];
    state.tasks = state.tasks || [];
    localStorage.setItem('life-pmc', JSON.stringify(state));
    nextId = Math.max(...state.tasks.map(t=>t.id), 10) + 1;
    nextYtId = Math.max(...state.ytFavorites.map(f=>f.id), 0) + 1;
  }
}

function cloudPush() {
  const token = getToken();
  const gistId = getGistId();
  if (!token || !gistId) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(() => {
    fetch(`${GITHUB_API}/gists/${gistId}`, {
      method: 'PATCH',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(state) } } })
    }).catch(() => {});
  }, 1200);
}

async function syncConnect() {
  const input = document.getElementById('sync-token-input');
  const token = input.value.trim();
  if (!token) { showToast('// トークンを入力してください'); return; }
  document.getElementById('sync-status-text').textContent = '接続中...';
  try {
    const gistId = await findOrCreateGist(token);
    localStorage.setItem('life-pmc-gh-token', token);
    localStorage.setItem('life-pmc-gist-id', gistId);
    await cloudPull(token, gistId);
    renderSyncStatus(true);
    render();
    renderYtFavorites();
    document.getElementById('pomo-count-today').textContent = state.pomoToday || 0;
    input.value = '';
    showToast('🟢 SYNC CONNECTED');
  } catch (e) {
    renderSyncStatus(false);
    showToast('// 接続に失敗しました。トークンを確認してください');
  }
}

function syncDisconnect() {
  localStorage.removeItem('life-pmc-gh-token');
  localStorage.removeItem('life-pmc-gist-id');
  renderSyncStatus(false);
  showToast('// SYNC DISCONNECTED（データはこの端末に残ります）');
}

async function initSync() {
  const token = getToken();
  const gistId = getGistId();
  if (!token || !gistId) { renderSyncStatus(false); return; }
  renderSyncStatus(true);
  try {
    await cloudPull(token, gistId);
    render();
    renderYtFavorites();
    document.getElementById('pomo-count-today').textContent = state.pomoToday || 0;
  } catch (e) {
    showToast('// 同期の取得に失敗しました');
  }
}

initSync();
</script>
